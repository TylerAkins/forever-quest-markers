name: Update Forever interface

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 3"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-forever-interface
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Fetch current Forever build
        run: |
          set -euo pipefail
          VERSIONS_URL="$(go run ./cmd/fqp update-interface --print-url)"
          curl --fail --silent --show-error "$VERSIONS_URL" \
            --output "${RUNNER_TEMP}/forever-versions"

      - name: Prepare compatibility release
        id: update
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          git rev-parse --verify "refs/tags/v${BASE_VERSION}^{commit}" >/dev/null
          go run ./cmd/fqp update-interface \
            --versions-file "${RUNNER_TEMP}/forever-versions"
          if git diff --quiet -- ForeverQuestPins.toc VERSION CHANGELOG.md RELEASE_NOTES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GAME_BUILD="$(go run ./cmd/fqp update-interface \
            --versions-file "${RUNNER_TEMP}/forever-versions" \
            --print-game-build)"
          {
            echo "changed=true"
            echo "version=$(tr -d '[:space:]' < VERSION)"
            echo "interface=$(sed -n 's/^## Interface: //p' ForeverQuestPins.toc)"
            echo "game_build=${GAME_BUILD}"
          } >> "$GITHUB_OUTPUT"

      - name: Close stale compatibility pull request
        if: steps.update.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head forever-interface-update \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No stale Forever interface pull request is open."
            exit 0
          fi
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --delete-branch \
            --comment "Closing automatically because the current Forever interface is already supported on main."

      - name: Tests
        if: steps.update.outputs.changed == 'true'
        run: go test ./...

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: forever-interface-update
          delete-branch: true
          commit-message: "chore: prepare v${{ steps.update.outputs.version }} for Forever"
          title: "chore: prepare v${{ steps.update.outputs.version }} for Forever ${{ steps.update.outputs.game_build }}"
          assignees: TylerAkins
          body: |
            @TylerAkins — automated WoW Forever compatibility update.

            - Game build: `${{ steps.update.outputs.game_build }}`
            - TOC Interface: `${{ steps.update.outputs.interface }}`
            - Addon version: `v${{ steps.update.outputs.version }}`

            Merging this reviewed PR automatically publishes the matching GitHub release and triggers CurseForge packaging.
          add-paths: |
            ForeverQuestPins.toc
            VERSION
            CHANGELOG.md
            RELEASE_NOTES.md
