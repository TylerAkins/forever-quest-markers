name: Update QuestieDB database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-questie-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Read previous stats and policy pin
        id: before
        run: |
          set -euo pipefail
          DATA=Database/build_report.json
          if [[ ! -f "$DATA" ]]; then DATA=/dev/null; fi
          OLD_SHA="$(jq -r '.artifact.sha256 // "unknown"' "$DATA" 2>/dev/null || echo unknown)"
          OLD_QUESTS="$(jq -r '.counts.quests // 0' "$DATA" 2>/dev/null || echo 0)"
          POLICY_SHA="$(sed -n 's/^[[:space:]]*policyCommit = "\([0-9a-f][0-9a-f]*\)".*/\1/p' Database/Metadata.lua)"
          test -n "$POLICY_SHA"
          {
            echo "old_sha=$OLD_SHA"
            echo "old_quests=$OLD_QUESTS"
            echo "policy=$POLICY_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Download QuestieDB preview artifact
        id: artifact
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl --fail --silent --show-error --location \
            "https://github.com/Questie/QuestieDB/releases/download/preview/QuestieDB-Forever.zip" \
            --output .cache/QuestieDB-Forever.zip
          echo "sha=$(sha256sum .cache/QuestieDB-Forever.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout Questie policy at pinned commit
        uses: actions/checkout@v7
        with:
          repository: Questie/Questie
          ref: ${{ steps.before.outputs.policy }}
          path: .cache/Questie
          sparse-checkout: |
            Database/Corrections/Holidays/quests
            Database/Corrections/questTagInfoCorrections.lua
          sparse-checkout-cone-mode: false

      - name: Generate database
        run: |
          go run ./cmd/fqp build-db \
            --questiedb .cache/QuestieDB-Forever.zip \
            --questiedb-sha "${{ steps.artifact.outputs.sha }}" \
            --questiedb-ref preview \
            --questie .cache/Questie \
            --questie-sha "${{ steps.before.outputs.policy }}" \
            --out Database

      - name: Go tests
        run: go test ./...

      - name: Read new stats
        id: after
        run: |
          {
            echo "sha=$(jq -r '.artifact.sha256 // "unknown"' Database/build_report.json)"
            echo "quests=$(jq -r '.counts.quests // 0' Database/build_report.json)"
            echo "coords=$(jq -r '.counts.coord_pins // 0' Database/build_report.json)"
            echo "turn_ins=$(jq -r '.counts.quests_with_turn_ins // 0' Database/build_report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Detect shipped quest data changes
        id: changes
        run: |
          if git diff -I '^-- Generated by ' --quiet -- Database/ForeverQuests.lua; then
            echo "quest_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "quest_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale database pull request
        if: steps.changes.outputs.quest_data == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head questie-db-update \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No stale QuestieDB database pull request is open."
            exit 0
          fi
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --delete-branch \
            --comment "Closing automatically because the regenerated shipped quest database now matches main."

      - name: Prepare patch release
        if: steps.changes.outputs.quest_data == 'true'
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          git rev-parse --verify "refs/tags/v${BASE_VERSION}^{commit}" >/dev/null
          go run ./cmd/fqp release prepare --base-version "$BASE_VERSION"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.quest_data == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: questie-db-update
          delete-branch: true
          commit-message: "chore: prepare v${{ steps.version.outputs.version }} QuestieDB database"
          title: "chore: prepare v${{ steps.version.outputs.version }} QuestieDB database update"
          assignees: TylerAkins
          body: |
            @TylerAkins — automated regeneration of `Database/` from the [QuestieDB](https://github.com/Questie/QuestieDB) Forever preview artifact and [Questie](https://github.com/Questie/Questie) policy.

            | | SHA-256 | Quests | Coordinate pins | Turn-ins |
            |---|---|---|---|---|
            | Previous | `${{ steps.before.outputs.old_sha }}` | ${{ steps.before.outputs.old_quests }} | - | - |
            | Updated | `${{ steps.after.outputs.sha }}` | ${{ steps.after.outputs.quests }} | ${{ steps.after.outputs.coords }} | ${{ steps.after.outputs.turn_ins }} |

            Merging this reviewed PR automatically publishes `v${{ steps.version.outputs.version }}` to GitHub and triggers CurseForge packaging.

            This PR is created only when the shipped quest database changes. Artifact SHA-only updates do not create releases.
          add-paths: |
            Database/ForeverQuests.lua
            Database/Metadata.lua
            Database/QuestTagCorrections.lua
            Database/build_report.json
            VERSION
            CHANGELOG.md
            RELEASE_NOTES.md
