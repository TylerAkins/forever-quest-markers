name: Update ATT database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-att-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Checkout All The Things
        uses: actions/checkout@v6
        with:
          repository: ATTWoWAddon/AllTheThings
          path: .cache/AllTheThings
          fetch-depth: 1
          sparse-checkout: |
            .contrib/.db/forever
            .contrib/Parser/lib/Constants
          sparse-checkout-cone-mode: false

      - name: Read previous stats
        id: before
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("Database/build_report.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"old_sha={data.get('att_sha', 'unknown')}\n")
              handle.write(f"old_quests={data.get('quests_emitted', 0)}\n")
          PY

      - name: Generate database
        run: python3 tools/build_quest_db.py --att .cache/AllTheThings --out Database

      - name: Tests
        run: |
          python3 tests/test_build_quest_db.py
          python3 tests/test_validate_generated.py
          python3 tests/test_addon_lua.py
          python3 -m pip install -r tests/requirements.txt
          python3 tests/test_tooltips_runtime.py
          python3 tests/test_compile_addon.py
          python3 tests/test_att_release.py
          python3 tests/test_update_forever_interface.py

      - name: Read new stats
        id: after
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("Database/build_report.json").read_text(encoding="utf-8"))
          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"sha={data.get('att_sha', 'unknown')}\n")
              handle.write(f"quests={data.get('quests_emitted', 0)}\n")
              handle.write(f"coords={data.get('coord_pins', 0)}\n")
          PY

      - name: Detect shipped quest data changes
        id: changes
        run: |
          if git diff --quiet -- Database/ForeverQuests.lua; then
            echo "quest_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "quest_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale database pull request
        if: steps.changes.outputs.quest_data == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head att-db-update \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No stale ATT database pull request is open."
            exit 0
          fi
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --delete-branch \
            --comment "Closing automatically because the regenerated shipped quest database now matches main."

      - name: Prepare patch release
        if: steps.changes.outputs.quest_data == 'true'
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          git rev-parse --verify "refs/tags/v${BASE_VERSION}^{commit}" >/dev/null
          python3 tools/att_release.py prepare --base-version "$BASE_VERSION"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.quest_data == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: att-db-update
          delete-branch: true
          commit-message: "chore: prepare v${{ steps.version.outputs.version }} ATT database"
          title: "chore: prepare v${{ steps.version.outputs.version }} ATT database update"
          body: |
            Automated regeneration of `Database/` from [All The Things](https://github.com/ATTWoWAddon/AllTheThings) Forever data.

            | | SHA | Quests | Coordinate pins |
            |---|---|---|---|
            | Previous | `${{ steps.before.outputs.old_sha }}` | ${{ steps.before.outputs.old_quests }} | - |
            | Updated | `${{ steps.after.outputs.sha }}` | ${{ steps.after.outputs.quests }} | ${{ steps.after.outputs.coords }} |

            Merging this reviewed PR automatically publishes `v${{ steps.version.outputs.version }}` to GitHub and triggers CurseForge packaging.

            This PR is created only when the shipped quest database changes. ATT SHA-only updates do not create releases.
          add-paths: |
            Database/ForeverQuests.lua
            Database/Metadata.lua
            Database/build_report.json
            VERSION
            CHANGELOG.md
            RELEASE_NOTES.md
