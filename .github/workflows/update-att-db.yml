name: Update ATT database

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-att-database
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit

      - name: Checkout All The Things
        uses: actions/checkout@v7
        with:
          repository: ATTWoWAddon/AllTheThings
          path: .cache/AllTheThings
          fetch-depth: 1
          sparse-checkout: |
            .contrib/.db/forever
            .contrib/Parser/lib/Constants
          sparse-checkout-cone-mode: false

      - name: Read previous stats
        id: before
        run: |
          DATA=Database/build_report.json
          if [[ ! -f "$DATA" ]]; then DATA=/dev/null; fi
          OLD_SHA="$(jq -r '.att_sha // "unknown"' "$DATA" 2>/dev/null || echo unknown)"
          OLD_QUESTS="$(jq -r '.quests_emitted // 0' "$DATA" 2>/dev/null || echo 0)"
          {
            echo "old_sha=$OLD_SHA"
            echo "old_quests=$OLD_QUESTS"
          } >> "$GITHUB_OUTPUT"

      - name: Generate database
        run: go run ./cmd/fqp build-db --att .cache/AllTheThings --out Database

      - name: Go tests
        run: go test ./...

      - name: Read new stats
        id: after
        run: |
          {
            echo "sha=$(jq -r '.att_sha // "unknown"' Database/build_report.json)"
            echo "quests=$(jq -r '.quests_emitted // 0' Database/build_report.json)"
            echo "coords=$(jq -r '.coord_pins // 0' Database/build_report.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Detect shipped quest data changes
        id: changes
        run: |
          if git diff -I '^-- Generated by ' --quiet -- Database/ForeverQuests.lua; then
            echo "quest_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "quest_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale database pull request
        if: steps.changes.outputs.quest_data == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head att-db-update \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No stale ATT database pull request is open."
            exit 0
          fi
          gh pr close "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --delete-branch \
            --comment "Closing automatically because the regenerated shipped quest database now matches main."

      - name: Prepare patch release
        if: steps.changes.outputs.quest_data == 'true'
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION="$(tr -d '[:space:]' < VERSION)"
          git rev-parse --verify "refs/tags/v${BASE_VERSION}^{commit}" >/dev/null
          go run ./cmd/fqp release prepare --base-version "$BASE_VERSION"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.quest_data == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: att-db-update
          delete-branch: true
          commit-message: "chore: prepare v${{ steps.version.outputs.version }} ATT database"
          title: "chore: prepare v${{ steps.version.outputs.version }} ATT database update"
          assignees: TylerAkins
          body: |
            @TylerAkins — automated regeneration of `Database/` from [All The Things](https://github.com/ATTWoWAddon/AllTheThings) Forever data.

            | | SHA | Quests | Coordinate pins |
            |---|---|---|---|
            | Previous | `${{ steps.before.outputs.old_sha }}` | ${{ steps.before.outputs.old_quests }} | - |
            | Updated | `${{ steps.after.outputs.sha }}` | ${{ steps.after.outputs.quests }} | ${{ steps.after.outputs.coords }} |

            Merging this reviewed PR automatically publishes `v${{ steps.version.outputs.version }}` to GitHub and triggers CurseForge packaging.

            This PR is created only when the shipped quest database changes. ATT SHA-only updates do not create releases.
          add-paths: |
            Database/ForeverQuests.lua
            Database/Metadata.lua
            Database/build_report.json
            VERSION
            CHANGELOG.md
            RELEASE_NOTES.md
