name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Numbered GitHub Release from an annotated v* tag (v0.1.5, etc.).
  versioned:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Package and publish GitHub Release
        uses: BigWigsMods/packager@v2

  # Downloadable test build for every merge to main. This deliberately avoids
  # pushing a moving tag that CurseForge could mistake for a stable release.
  preview:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python tests
        run: |
          python3 tests/test_build_quest_db.py
          python3 tests/test_validate_generated.py
          python3 tests/test_addon_lua.py
          python3 tests/test_compile_addon.py

      - name: Package addon zip
        uses: BigWigsMods/packager@v2
        with:
          args: -d -n "{package-name}-preview{classic}"

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: ForeverQuestPins-${{ github.sha }}
          path: .release/ForeverQuestPins-preview*.zip
          if-no-files-found: error
          include-hidden-files: true
