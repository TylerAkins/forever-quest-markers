name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check TOC and tree
        run: |
          set -euo pipefail
          test -f ForeverQuestPins.toc
          grep -qE '^## Interface: 16001' ForeverQuestPins.toc
          grep -qE '^## Version:' ForeverQuestPins.toc
          grep -qxF '## SavedVariables: ForeverQuestPinsDB, ForeverQuestPinsDB_Settings' ForeverQuestPins.toc
          grep -qxF '## SavedVariablesPerCharacter: ForeverQuestPinsCharDB, ForeverQuestPinsCharacterSettings' ForeverQuestPins.toc
          test -f MapPins.xml
          test -f Media/QuestAvailable.tga
          test -f Database/ForeverQuests.lua
          test -f Database/Metadata.lua
          test -f LICENSE
          test -f ATTRIBUTION.md
          test -f README.md
          test -f CHANGELOG.md
          test -f RELEASE_NOTES.md
          test -f VERSION
          test -f docs/DEVELOPMENT.md
          test -f tools/update_forever_interface.py
          python3 tools/att_release.py validate-notes \
            --version "$(tr -d '[:space:]' < VERSION)"
          grep -qE '^## X-Website:' ForeverQuestPins.toc
          grep -qE '^## X-Issues:' ForeverQuestPins.toc

      - name: Python tests
        run: |
          python3 tests/test_build_quest_db.py
          python3 tests/test_emit_wowhead.py
          python3 tests/test_validate_generated.py
          python3 tests/test_addon_lua.py
          python3 -m pip install -r tests/requirements.txt
          python3 tests/test_tooltips_runtime.py
          python3 tests/test_compile_addon.py
          python3 tests/test_att_release.py
          python3 tests/test_update_forever_interface.py
          python3 -m unittest discover -s tests -p test_repair_local_settings.py

      - name: Validate automated release intent
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          QUEST_DATA_CHANGED=false
          if ! git diff --quiet "$BASE_SHA" HEAD -- Database/ForeverQuests.lua; then
            QUEST_DATA_CHANGED=true
          fi
          PREVIOUS_INTERFACE="$(git show "${BASE_SHA}:ForeverQuestPins.toc" | sed -n 's/^## Interface: //p')"
          CURRENT_INTERFACE="$(sed -n 's/^## Interface: //p' ForeverQuestPins.toc)"
          if [[ "$QUEST_DATA_CHANGED" == false && "$PREVIOUS_INTERFACE" == "$CURRENT_INTERFACE" ]]; then
            exit 0
          fi
          PREVIOUS_VERSION="$(git show "${BASE_SHA}:VERSION" | tr -d '[:space:]')"
          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 tools/att_release.py validate \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$CURRENT_VERSION" \
            --release-content-changed
          grep -qF "## ${CURRENT_VERSION} " CHANGELOG.md

      - name: Regenerate Wowhead database and fail on drift
        run: |
          set -euo pipefail
          python3 tools/emit_wowhead_db.py --out Database
          git diff --exit-code -- Database/ForeverQuests.lua Database/Metadata.lua Database/build_report.json

      - name: Dry-run package
        uses: BigWigsMods/packager@v2
        with:
          args: -d
